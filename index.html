<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Progressive enhancement flag: scroll-reveal hiding only applies
      // when JS is running (see .js .mf-reveal in index.css).
      document.documentElement.classList.add('js')
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mona Fouad · Design Engineer</title>
    <meta name="description" content="Portfolio of Mona Fouad, a design engineer working across interfaces, motion and the code that makes them feel right." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <!-- Cicla brand faces (Satoshi, Zodiak), used only in the Cicla
         artwork. Loaded here rather than via CSS @import so they never sit
         after Tailwind's expanded output (which is an invalid @import
         position). -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@1,2&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=zodiak@1,2&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
